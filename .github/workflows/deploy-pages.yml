name: Deploy a GitHub Pages

on:
  push:
    branches: ["claude/readme-testing-9w5ua6"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir la app como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: guia-nutricional
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
